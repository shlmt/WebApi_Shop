<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>המוצרים שלנו | משולשים</title>
    <link href="./Style/Products.css" rel="stylesheet" />
    <template id="temp-card">
        <div class="card">
            <div class="img-w">
                <img src="tmp.jpg" alt="">
            </div>
            <h1></h1>
            <p class="price"></p>
            <p class="description"></p>
            <button class="add-to-cart" type="button">הוספה לסל</button>
        </div>
    </template>
    <template id="temp-category">
        <div class="cb checkbox">
            <input type="checkbox" class="opt" id="" value="">
            <label for="">
                <span class="OptionName"></span>
                <span class="Count"></span>
            </label>
        </div>
    </template>
</head>
<body>
    <header>
        <div class="bar">
            <a class="brand" href="Products.html">משולשים</a>
            <nav class="QuickLinks" aria-label="ניווט ראשי">
                <a href="Products.html" aria-current="page">המוצרים שלנו</a>
                <a id="accountLink" href="login.html">החשבון שלי</a>
            </nav>
            <div class="header-actions">
                <span id="userName" class="user-name" hidden></span>
                <a class="cart-link" href="ShoppingBag.html" aria-label="מעבר לסל הקניות">
                    סל הקניות <span id="ItemsCountText" class="cart-count">0</span>
                </a>
            </div>
        </div>
    </header>
    <main class="shop-layout">
        <aside id="filters" class="Filters">
            <div class="filter-heading">
                <h2>סינון מוצרים</h2>
                <button class="Clear" type="button" onclick="removeAllCart()">ריקון הסל</button>
            </div>
            <div class="filter-group nameFilter">
                <label for="nameSearch">חיפוש לפי שם מוצר</label>
                <input type="search" id="nameSearch" placeholder="מה מתחשק לכם?">
            </div>
            <div id="categoryList" class="filter-group category-list">
                <h3>קטגוריה</h3>
            </div>
            <div id="priceRangeFilter" class="filter-group price-filter">
                <h3>טווח מחיר</h3>
                <label for="minPrice">מינימום</label>
                <div class="price-input-wrap"><input type="number" min="0" id="minPrice" class="priceInputText" placeholder="0"><span>₪</span></div>
                <label for="maxPrice">מקסימום</label>
                <div class="price-input-wrap"><input type="number" min="0" id="maxPrice" class="priceInputText" placeholder="ללא הגבלה"><span>₪</span></div>
            </div>
            <button class="filter-submit" type="button" onclick="filterProducts()">הצגת תוצאות</button>
        </aside>
        <section class="products-area" aria-labelledby="products-title">
            <div class="products-heading">
                <div>
                    <p class="eyebrow">מהתנור אליכם</p>
                    <h1 id="products-title">הטעימים שלנו</h1>
                </div>
                <p class="product-count"><span id="productCount">0</span> מוצרים</p>
            </div>
            <div id="productList" class="product-grid"></div>
        </section>
    </main>
</body>
<script src="./Scripts/store.js"></script>
<script src="./Scripts/Product.js"></script>

</html>
